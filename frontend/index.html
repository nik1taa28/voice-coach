<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Coach</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  button { font-size: 1rem; padding: .5rem 1rem; }
  #status { color: #555; margin: .75rem 0; }
  #warn { color: #b45309; font-weight: 600; min-height: 1.2em; }
  #timing { font-family: ui-monospace, monospace; font-size: .85rem; color: #333; min-height: 1.2em; }
  #transcript { list-style: none; padding: 0; }
  #transcript li { border-left: 3px solid #999; padding: .25rem .75rem; margin: .5rem 0; }
  #transcript li.error { border-color: #b91c1c; color: #b91c1c; }
</style>
</head>
<body>
<h1>Voice Coach</h1>
<p>M1: speak, press stop, see the transcript and per-stage timing.</p>
<button id="toggle" disabled>Start recording</button>
<div id="status">connecting…</div>
<div id="warn"></div>
<div id="timing"></div>
<ul id="transcript"></ul>

<script>
const TARGET_RATE = 16000;
const BATCH_SAMPLES = 2048; // worklet posts this many samples at a time

// The worklet runs on the audio thread. It only batches samples and hands them to the main thread.
const workletSource = `
class Batcher extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Float32Array(${BATCH_SAMPLES}); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.buf[this.n++] = ch[i];
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.slice(0));
        this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor('batcher', Batcher);
`;

const $ = (id) => document.getElementById(id);
const toggle = $('toggle'), statusEl = $('status'), warnEl = $('warn'), timingEl = $('timing'), list = $('transcript');

let ws, ctx, stream, node, recording = false, stopPressedAt = 0;
let ratio = 1, carry = new Float32Array(0);

function addLine(text, cls) {
  const li = document.createElement('li');
  li.textContent = text; // textContent, never innerHTML: server text is untrusted
  if (cls) li.className = cls;
  list.appendChild(li);
}

// Box-average downsample from the mic's native rate to 16 kHz, then Float32 [-1,1] -> Int16.
// `carry` keeps input samples that did not fill a whole output sample, so chunks join cleanly.
function downsample(chunk) {
  const input = new Float32Array(carry.length + chunk.length);
  input.set(carry); input.set(chunk, carry.length);
  const n = Math.floor(input.length / ratio);
  const out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(Math.floor((i + 1) * ratio), input.length);
    let sum = 0;
    for (let j = start; j < end; j++) sum += input[j];
    const s = Math.max(-1, Math.min(1, sum / Math.max(1, end - start)));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  carry = input.slice(Math.floor(n * ratio));
  return out;
}

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${scheme}://${location.host}/ws`);
  ws.onopen = () => { statusEl.textContent = 'connected'; toggle.disabled = false; };
  ws.onclose = () => { statusEl.textContent = 'disconnected - reload the page'; toggle.disabled = true; };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'session') {
      statusEl.textContent = `connected, session ${msg.session_id.slice(0, 8)}`;
    } else if (msg.type === 'transcript') {
      const roundTrip = Math.round(performance.now() - stopPressedAt);
      addLine(msg.text);
      timingEl.textContent =
        `audio ${msg.audio_ms} ms | asr ${msg.asr_ms} ms | rtf ${msg.rtf} | ` +
        `stop->text ${roundTrip} ms (browser clock, includes network) | provider ${msg.provider}`;
      warnEl.textContent = msg.provider === 'fake'
        ? 'FAKE provider: this text is a placeholder, not real speech recognition.' : '';
    } else if (msg.type === 'error') {
      addLine(`error: ${msg.reason}`, 'error');
    }
  };
}

async function startRecording() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } });
  } catch (err) {
    addLine(`microphone unavailable: ${err.name}`, 'error');
    return;
  }
  ctx = new AudioContext();
  ratio = ctx.sampleRate / TARGET_RATE;
  carry = new Float32Array(0);
  const url = URL.createObjectURL(new Blob([workletSource], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  node = new AudioWorkletNode(ctx, 'batcher');
  node.port.onmessage = (e) => {
    if (recording && ws.readyState === WebSocket.OPEN) ws.send(downsample(e.data).buffer);
  };
  ctx.createMediaStreamSource(stream).connect(node); // not connected to speakers: no feedback

  ws.send(JSON.stringify({ type: 'utterance_start', sample_rate: TARGET_RATE }));
  recording = true;
  toggle.textContent = 'Stop & transcribe';
  statusEl.textContent = `recording (mic ${ctx.sampleRate} Hz -> ${TARGET_RATE} Hz)`;
}

async function stopRecording() {
  recording = false;
  stream.getTracks().forEach((t) => t.stop());
  await ctx.close();
  stopPressedAt = performance.now();
  ws.send(JSON.stringify({ type: 'utterance_end' }));
  toggle.textContent = 'Start recording';
  statusEl.textContent = 'transcribing…';
}

toggle.onclick = () => (recording ? stopRecording() : startRecording());
connect();
</script>
</body>
</html>

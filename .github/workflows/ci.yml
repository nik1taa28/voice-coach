name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-asr.txt
      # requirements-asr.txt is needed only because tests/test_whisper.py uses numpy (it stubs the model: no download).
      - name: Install
        run: pip install -r requirements.txt -r requirements-asr.txt
      # The suite has no per-test timeout, so a hung test would otherwise run until the job times out.
      - name: Test
        run: python -m pytest -q -o faulthandler_timeout=60

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t voice-coach:ci .
      - name: Start the container and check it answers
        run: |
          docker run -d --name voice-coach -p 127.0.0.1:8000:8000 voice-coach:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/ > /dev/null
          curl -sf http://127.0.0.1:8000/metrics > /dev/null
          curl -sf http://127.0.0.1:8000/dashboard > /dev/null
      - name: Container logs
        if: always()
        run: docker logs voice-coach || true
